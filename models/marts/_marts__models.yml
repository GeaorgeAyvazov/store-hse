version: 2
models:
- name: fct_orders
  description: Одна строка - один нетестовый заказ. Суммы заказа и платежей хранятся
    раздельно.
  columns:
  - name: order_id
    description: Номер заказа.
    data_tests:
    - unique
    - not_null
  - name: customer_id
    description: Номер клиента.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customers')
          field: customer_id
  - name: order_date
    description: Дата оформления заказа.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_dates')
          field: date_day
  - name: ordered_at
    description: Дата и время оформления заказа.
    data_tests:
    - not_null
  - name: order_status
    description: Статус заказа.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - paid
          - pending
          - returned
          - cancelled
  - name: order_amount
    description: Сумма заказа после скидок, руб.
    data_tests:
    - not_null
    - non_negative
  - name: paid_amount
    description: Сумма успешных оплат без возвратов, руб.
    data_tests:
    - not_null
    - non_negative
  - name: refunded_amount
    description: Сумма возвратов положительным числом, руб.
    data_tests:
    - not_null
    - non_negative
  - name: net_paid_amount
    description: Успешно оплачено минус возвращено, руб.
    data_tests:
    - not_null
  - name: successful_payments_count
    description: Число успешных оплат без возвратов.
    data_tests:
    - not_null
    - non_negative
  - name: first_paid_at
    description: Время первой успешной оплаты; null без оплат.
  - name: is_confirmed
    description: '{{ doc("confirmed_order") }}'
    data_tests:
    - not_null
  - name: items_count
    description: Число разных товаров в заказе; не сумма quantity.
    data_tests:
    - not_null
    - non_negative
- name: fct_order_items
  description: Одна строка - один товар в нетестовом заказе.
  columns:
  - name: order_item_id
    description: 'Составной ключ: order_id и product_id через дефис.'
    data_tests:
    - unique
    - not_null
  - name: order_id
    description: Номер заказа.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: product_id
    description: Номер товара.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_products')
          field: product_id
  - name: customer_id
    description: Номер клиента.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customers')
          field: customer_id
  - name: order_date
    description: Дата оформления заказа.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_dates')
          field: date_day
  - name: quantity
    description: Количество единиц товара в позиции.
    data_tests:
    - not_null
    - non_negative
  - name: unit_price
    description: Цена единицы товара до скидки, руб.
    data_tests:
    - not_null
    - non_negative
  - name: discount_amount
    description: Скидка на всю позицию, руб.
    data_tests:
    - not_null
    - non_negative
  - name: line_amount
    description: quantity * unit_price - discount_amount, руб.
    data_tests:
    - not_null
    - non_negative
  - name: order_status
    description: Статус заказа для анализа возвратов.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - paid
          - pending
          - returned
          - cancelled
  - name: is_confirmed
    description: '{{ doc("confirmed_order") }}'
    data_tests:
    - not_null
- name: dim_customers
  description: Одна строка - один клиент, включая не купивших. Текущие атрибуты обновляются
    по Type 1.
  columns:
  - name: customer_id
    description: Номер клиента.
    data_tests:
    - unique
    - not_null
  - name: registered_at
    description: Дата и время регистрации.
    data_tests:
    - not_null
  - name: registration_date
    description: Дата регистрации.
    data_tests:
    - not_null
  - name: city
    description: Текущий город клиента.
    data_tests:
    - not_null
  - name: acquisition_channel
    description: Канал привлечения.
    data_tests:
    - not_null
  - name: first_confirmed_order_id
    description: Первый подтверждённый заказ по ordered_at, затем order_id; null без
      покупок.
    data_tests:
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
  - name: first_confirmed_at
    description: Время оформления первой подтверждённой покупки; null без покупок.
  - name: confirmed_orders_count
    description: Число подтверждённых заказов; 0 без покупок.
    data_tests:
    - not_null
    - non_negative
  - name: confirmed_revenue
    description: Сумма подтверждённых заказов после скидок, руб.; 0 без покупок.
    data_tests:
    - not_null
    - non_negative
  - name: is_buyer
    description: Есть хотя бы одна подтверждённая покупка.
    data_tests:
    - not_null
- name: dim_products
  description: Одна строка - один товар с текущим брендом и иерархией категорий. Атрибуты
    обновляются по Type 1.
  columns:
  - name: product_id
    description: Номер товара.
    data_tests:
    - unique
    - not_null
  - name: product_name
    description: Название товара.
    data_tests:
    - not_null
  - name: brand
    description: Бренд.
    data_tests:
    - not_null
  - name: category_name
    description: Непосредственная категория товара.
    data_tests:
    - not_null
  - name: parent_category_name
    description: Непосредственный родитель категории; null у корня.
  - name: root_category_name
    description: 'Корень дерева категорий: Electronics или Home.'
    data_tests:
    - not_null
- name: dim_dates
  description: Одна строка - один день от минимальной до максимальной даты всех исходных
    заказов включительно.
  columns:
  - name: date_day
    description: Дата календаря.
    data_tests:
    - unique
    - not_null
  - name: year
    description: Календарный год.
    data_tests:
    - not_null
  - name: quarter
    description: 'Номер квартала: 1-4.'
    data_tests:
    - not_null
  - name: month
    description: 'Номер месяца: 1-12.'
    data_tests:
    - not_null
  - name: day_of_month
    description: 'День месяца: 1-31.'
    data_tests:
    - not_null
  - name: day_of_week
    description: 'День недели ISO: понедельник - 1, воскресенье - 7.'
    data_tests:
    - not_null
  - name: is_weekend
    description: Суббота или воскресенье.
    data_tests:
    - not_null
